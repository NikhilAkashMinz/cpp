<!DOCTYPE html>
<html>
    <head>
        <title>Neon Gaming</title>
    </head>
    <body>
        <h1>Neon Gaming</h1>
        <div class="game-container">
            <button class="btn" onclick="ol.bkgclr()">Change Background</button>
            <button class="btn btn-orange">Start Game</button>
            <button class="btn">Leaderboard</button>
        </div>
        <p class="neon-text">Welcome to Neon Gaming!</p>
        <div class="neon-box">
            <p>Experience the future of gaming</p>
        </div>
    </body>
    <style type="text/css">
        body {
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            animation: neonGlow 2s infinite alternate;
        }
        
        @keyframes neonGlow {
            0% { box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00; }
            100% { box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
        }
        
        h1 {
            text-align: center;
            font-size: 48px;
            text-transform: uppercase;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            animation: flicker 1.5s infinite alternate;
        }
        
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }
        
        .game-container {
            max-width: 800px;
            margin: 50px auto;
            border: 3px solid #00ffff;
            padding: 20px;
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px #00ffff;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }
        
        .btn-orange {
            border-color: #ff6600;
            color: #ff6600;
        }
        
        .btn-orange:hover {
            background: #ff6600;
            color: #000;
            box-shadow: 0 0 20px #ff6600;
        }
        
        .red{color: red;}
        .navy{color: navy;}
        .yellow{color: #ffff00;}
        .blue{color: #0066ff;}
        .green{color: #00ff00;}
        .orange{color: #ff6600;}
        .purple{color: #9900ff;}
        .pink{color: #ff00ff;}
        .brown{color: #8b4513;}
        .aqua{color: #00ffff;}
        .gray{color: #888;}
        .cyan{color: #00ffff;}
        .maroon{color: #800000;}
        .teal{color: #008080;}
        
        .neon-text {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            text-align: center;
            font-size: 24px;
        }
        
        .neon-box {
            border: 2px solid #ff00ff;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 0 10px #ff00ff;
            text-align: center;
        }
    </style>
    <script>
        const ol = {
            bkgclr: function() {
                const colors = ['#ff00ff', '#00ffff', '#00ff00', '#ffff00', '#ff6600', '#ff0066', '#6600ff', '#00ff66'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.style.backgroundColor = randomColor;
                document.body.style.boxShadow = `inset 0 0 50px ${randomColor}`;
            }
        };
    </script>
</html>
